<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Clinic Management System (CMS)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        var path = window.location.pathname || "/";
        var normalized = path.replace(/\/+$/, "") || "/";
        var href = (window.location.href || "").toLowerCase();
        if (
          normalized.indexOf("/api/oauth") === 0 ||
          normalized.indexOf("/app-auth") === 0 ||
          normalized.indexOf("/manus-oauth") === 0 ||
          href.indexOf("/app-auth") !== -1 ||
          href.indexOf("/api/oauth/callback") !== -1 ||
          href.indexOf("/manus-oauth/") !== -1
        ) {
          window.location.replace("/login");
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
