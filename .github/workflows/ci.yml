name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: clinic_cms_ci
          MYSQL_USER: clinic_ci
          MYSQL_PASSWORD: clinic_ci
          MYSQL_ROOT_PASSWORD: root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://clinic_ci:clinic_ci@127.0.0.1:3306/clinic_cms_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.OS }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply CI database migrations via Drizzle migrate
        run: |
          npx tsx -e "
            import { drizzle } from 'drizzle-orm/mysql2';
            import { migrate } from 'drizzle-orm/mysql2/migrator';
            import mysql from 'mysql2/promise';
            try {
              console.log('Connecting to database:', process.env.DATABASE_URL);
              const connection = await mysql.createConnection(process.env.DATABASE_URL);
              const db = drizzle(connection);
              console.log('Running drizzle migrations from ./drizzle...');
              await migrate(db, { migrationsFolder: './drizzle' });
              console.log('Database migrations applied successfully.');
              await connection.end();
            } catch (err) {
              console.error('Migration execution failed:', err);
              process.exit(1);
            }
          "

      - name: Run TypeScript check
        run: pnpm check

      - name: Run unit tests
        run: pnpm test --run

      - name: Run production build
        run: pnpm build
